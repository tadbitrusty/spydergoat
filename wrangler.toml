name = "spydergoat"
main = "src/api/worker.js"
compatibility_date = "2024-01-01"

# Production routes
routes = [
  { pattern = "spydergoat.com/*", zone_name = "spydergoat.com" },
  { pattern = "www.spydergoat.com/*", zone_name = "spydergoat.com" }
]

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "SPYDERGOAT_KV"
id = "701ce0d76afe47f1afb7c08ea5710344"
preview_id = "07435acc67dc44a4a71bc747bc649ecf"

# D1 database for users
[[d1_databases]]
binding = "DB"
database_name = "spydergoat-db"
database_id = "7a4439ad-a213-432e-a1cd-e14065f60df2"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/mjd", "/jd", "/checkout/pro", "/success", "/webhook", "/sitemap.xml", "/robots.txt"]

[vars]
ENVIRONMENT = "production"
# Paid cutover active after production-shaped edge/fetch and Stripe item-period
# compatibility fixes. Roll back immediately on any remaining live smoke failure.
PAID_ACCESS_ENABLED = "true"
CHECKOUT_ORIGINS = "https://spydergoat.com,https://www.spydergoat.com"
STRIPE_LIVEMODE = "true"
STRIPE_PRO_PRODUCT_ID = "prod_TrD9fKtsjdaZmB"
STRIPE_PRO_PRICE_ID = "price_1StUjbK2tmo6HKYKAIvHBHUN"
STRIPE_PRO_AMOUNT = "489"

[dev]
port = 8787
local_protocol = "http"
