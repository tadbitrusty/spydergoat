name = "spydergoat"
main = "src/api/worker.js"
compatibility_date = "2024-01-01"

# Production routes
routes = [
  { pattern = "spydergoat.com/*", zone_name = "spydergoat.com" },
  { pattern = "www.spydergoat.com/*", zone_name = "spydergoat.com" }
]

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "SPYDERGOAT_KV"
id = "701ce0d76afe47f1afb7c08ea5710344"
preview_id = "07435acc67dc44a4a71bc747bc649ecf"

# D1 database for users
[[d1_databases]]
binding = "DB"
database_name = "spydergoat-db"
database_id = "7a4439ad-a213-432e-a1cd-e14065f60df2"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/mjd", "/jd", "/receipt", "/verify", "/keys", "/checkout", "/success", "/webhook", "/sitemap.xml", "/robots.txt"]

[vars]
ENVIRONMENT = "production"
PAID_ENABLED = "false"
RECEIPT_RETENTION_DAYS = "90"
# Secret bindings (never commit values): RECEIPT_PRIVATE_KEY_PKCS8,
# RECEIPT_KEYRING, KEY_DELIVERY_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.

[triggers]
crons = ["17 3 * * *"]

[dev]
port = 8787
local_protocol = "http"
